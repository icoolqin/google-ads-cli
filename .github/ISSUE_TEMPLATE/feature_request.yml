name: Feature request
description: Propose a Google Ads operation or developer-experience improvement.
title: "[Feature]: "
labels:
  - "enhancement"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show the desired CLI command or agent workflow, if possible.
    validations:
      required: true
  - type: dropdown
    id: write-risk
    attributes:
      label: Does this change account state?
      options:
        - "No, it is read-only"
        - "Yes, it mutates Google Ads resources"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Relevant Google Ads API service
      description: Link the official service or resource documentation when known.
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Explain plan, validation, execution, idempotency, or rollback concerns.
